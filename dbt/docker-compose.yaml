services:
  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-dbt
    # DB 접속 정보는 Airflow 가 실행할 때 Connection 에서 넘긴다 (airflow/plugins/common/dbt.py).
    # .env 는 터미널에서 직접 dbt 를 돌릴 때만 값이 필요. 파일 자체는 있어야 하므로 비어 있어도 됨 (touch .env)
    # (path/required 문법은 compose 2.24+ 전용이라 구버전 서버 호환을 위해 단순 형식 사용)
    env_file:
      - .env
    volumes:
      - ./projects:/dbt/projects
      - ./profiles.yml:/root/.dbt/profiles.yml:ro
    working_dir: /dbt/projects/my_project
    restart: unless-stopped
    # host.docker.internal 은 Docker Desktop(Mac/Windows) 전용 기능이라 Linux에서는
    # 기본적으로 해석 안 됨. 이 줄로 Linux Docker Engine에서도 동일하게 호스트를 가리키게 함.
    # (실제 타겟 DB가 같은 서버가 아니라 별도 호스트라면 .env의 PG_HOST/MSSQL_HOST/YB_HOST를
    #  그 실제 호스트명/IP로 바꾸고 이 설정은 무시하면 됨)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dbt-docs:
    image: dbt-dbt:latest  # dbt 서비스와 동일 이미지 재사용 (별도 빌드 없음)
    container_name: dev-dbt-docs
    # 문서 생성(dbt docs generate)은 DB 접속이 필요하므로 Airflow DAG 에서 하고,
    # 이 컨테이너는 생성된 target/ 정적 파일만 보여준다 (DB 접속 정보 불필요)
    volumes:
      - ./projects:/dbt/projects:ro
    ports:
      - "8081:8080"
    entrypoint: ["python", "-m", "http.server", "8080", "--directory", "/dbt/projects/my_project/target"]
    restart: unless-stopped
