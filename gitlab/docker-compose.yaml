services:
  gitlab:
    image: gitlab/gitlab-ce:18.11.5-ce.0
    container_name: gitlab-test
    restart: "no"
    hostname: localhost
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url "http://localhost:8929"
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['time_zone'] = 'Asia/Seoul'
        gitlab_rails['initial_root_password'] = "${GITLAB_ROOT_PASSWORD}"

        # 내부 로그(current): 파일당 200MB, 90개 보관
        logging['svlogd_size'] = 200 * 1024 * 1024
        logging['svlogd_num'] = 90
        logging['svlogd_timeout'] = 86400
        logging['svlogd_filter'] = 'gzip'

        # 내부 로그(*.log): 매일 회전, 파일당 200MB, 90개 보관
        logging['logrotate_frequency'] = 'daily'
        logging['logrotate_maxsize'] = '200M'
        logging['logrotate_rotate'] = 90
        logging['logrotate_compress'] = 'compress'
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: '256m'
    # Docker stdout 로그: 450MB 1개로 제한
    logging:
      driver: json-file
      options:
        max-size: "450m"
        max-file: "1"

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data: